[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "civicflow"
version = "0.1.0"
description = "Public infrastructure transparency platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.5,<6",
    "dj-database-url>=2.3,<4",
    "Django>=5.2,<5.3",
    "django-filter>=25.1,<26",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28,<1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<7",
    "uvicorn[standard]>=0.35,<1",
    "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
    "factory-boy>=3.3,<4",
    "mypy>=1.17,<2",
    "pre-commit>=4.2,<5",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["civicflow*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "civicflow.settings.test"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--strict-markers --disable-warnings --tb=short"

[tool.coverage.run]
branch = true
source = ["apps", "civicflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "SIM"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "civicflow"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
