{% extends "base.html" %}{% block title %}Tenders — CivicFlow{% endblock %}{% block content %}<section class="tracking-section"><div class="container"><h1>Open tenders</h1>{% for tender in tenders %}<div class="tracking-card"><h2>{{ tender.title }}</h2><p>{{ tender.reference }} · Deadline {{ tender.deadline }}</p><a class="button button-primary" href="{% url 'procurement:bid' tender.pk %}">Submit bid</a></div>{% empty %}<p>No published tenders.</p>{% endfor %}</div></section>{% endblock %}
