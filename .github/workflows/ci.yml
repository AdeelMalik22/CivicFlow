name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev libgeos-dev
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Validate migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: civicflow.settings.test
      - name: Validate Django configuration
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: civicflow.settings.test
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --file /tmp/civicflow-schema.yml --validate
        env:
          DJANGO_SETTINGS_MODULE: civicflow.settings.test

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: civicflow
          POSTGRES_USER: civicflow
          POSTGRES_PASSWORD: civicflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civicflow -d civicflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdal-bin libgdal-dev libgeos-dev
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://civicflow:civicflow@localhost:5432/civicflow
          DJANGO_SETTINGS_MODULE: civicflow.settings.test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: civicflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
